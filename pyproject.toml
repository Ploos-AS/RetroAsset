[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retroasset"
version = "0.0.1"
description = "Compiler and validator for genuine retro-computing assets"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
retroasset = "retroasset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
