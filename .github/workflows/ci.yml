name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: retroasset targets
      - run: retroasset profile amiga-ocs
      - run: retroasset profile ansi-cp437
      - run: retroasset validate examples/amiga-ocs-sprite.json
      - run: retroasset validate examples/ansi-cp437-screen.json
