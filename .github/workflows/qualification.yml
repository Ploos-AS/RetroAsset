name: Emulator qualification

on:
  workflow_dispatch:
  push:
    branches: [m0-foundation]
    paths:
      - "src/retroasset/c64prg.py"
      - "src/retroasset/petscii.py"
      - "qualification/**"
      - ".github/workflows/qualification.yml"

jobs:
  c64-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_c64prg tests.test_c64prg_layout -v
      - name: Record qualification boundary
        run: |
          mkdir -p qualification/evidence
          printf '%s\n'             'C64 structural qualification: PASS'             'VICE runtime qualification: NOT YET RUN'             > qualification/evidence/c64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retroasset-c64-qualification
          path: qualification/evidence/c64.txt
