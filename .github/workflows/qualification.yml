name: Emulator qualification

on:
  workflow_dispatch:
  push:
    branches: [m0-foundation]
    paths:
      - "src/retroasset/c64prg.py"
      - "src/retroasset/petscii.py"
      - "qualification/**"
      - ".github/workflows/qualification.yml"

jobs:
  c64-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_c64prg tests.test_c64prg_layout -v
      - run: python qualification/generate_c64_fixture.py
      - uses: actions/upload-artifact@v4
        with:
          name: retroasset-c64-fixture
          path: qualification/generated/

  c64-vice:
    runs-on: ubuntu-latest
    needs: c64-structural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python qualification/generate_c64_fixture.py
      - name: Install VICE
        run: |
          sudo apt-get update
          sudo apt-get install -y vice
          x64sc --version
      - name: Run VICE qualification
        run: |
          xvfb-run -a x64sc             -autostart qualification/generated/fixture.prg             -moncommands qualification/vice-monitor.txt             -console
      - name: Verify emulated RAM
        run: python qualification/verify_c64.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retroasset-c64-vice-evidence
          path: qualification/generated/
